<button class="app-button" [class.accent]="variant === 'accent'" [class.danger]="variant === 'danger'" [class.full-width]="fullWidth"
    [class.compact]="compact" [type]="type" [disabled]="disabled"
    [attr.title]="title || null" [attr.aria-label]="ariaLabel || null" (click)="onClick($event)">
    <ng-content></ng-content>
</button>
