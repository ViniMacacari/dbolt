<div #editorShell class="code-editor-container d-flex h-100 gap-2"
    [class.results-expanded]="queryResultExpanded && queryResultOpen">
    <div class="editor-toolbar d-flex align-items-center flex-column">
        <button class="btn">
            <img (click)="runSelected()" src="icons/run.png" [title]="t('editor.runSelected')" height="15px">
        </button>
        <button class="btn">
            <img (click)="runAll()" src="icons/execute-all.png" [title]="t('editor.runAll')" height="15px">
        </button>
        <button type="button" class="btn" [class.btn-inactive]="isLoadingQuery" [disabled]="isLoadingQuery"
            (click)="openDataflow()" [title]="t('queryDataflow.title')" [attr.aria-label]="t('queryDataflow.title')">
            <img src="icons/diagram.png" height="15" width="15" alt="">
        </button>
        <button class="btn" (click)="formatCode()">
            <img src="icons/star.png" [title]="t('editor.indentCode')" height="15px">
        </button>
        <button class="btn" (click)="saveQuery()">
            <img src="icons/save.png" [title]="t('editor.saveCode')" height="15px">
        </button>
        <button class="btn" (click)="saveAs()">
            <img src="icons/save_as.png" [title]="t('editor.saveCodeAs')" height="15px">
        </button>
        <button class="btn" [class.btn-inactive]="!canUseVersionMessage" (click)="openVersionMessage()">
            <img src="icons/book.png"
                [title]="canUseVersionMessage ? t('editor.saveWithMessage') : t('editor.saveWithMessageDisabled')"
                height="15px">
        </button>
        <button type="button" class="btn" (click)="openHistory()" [title]="t('queryHistory.title')"
            [attr.aria-label]="t('queryHistory.title')">
            <img src="icons/history.png" height="15" width="15" alt="">
        </button>
    </div>
    <div #codeEditorPanel class="code-editor py-2" [class.has-results]="queryResultOpen"
        [class.results-expanded]="queryResultExpanded"
        [class.result-panel-opening]="queryResultPanelOpening"
        [style.--query-result-height]="queryResultHeight + 'px'">
        <div class="editor-panel">
            <div #editorContainer class="editor"></div>
        </div>
        <div class="result-panel" [class.result-panel-opening]="queryResultPanelOpening" *ngIf="queryResultOpen">
            <app-table-query [class.result-content-entering]="queryResultContentEntering"
                (newValuesQuery)="newValues()" [query]="queryReponse" [resultHeight]="queryResultHeight"
                [columns]="queryColumns" [calcWidth]="widthTable" [rowLimit]="queryFetchSize" [totalRows]="maxResultLines"
                [isSelectResult]="queryResultIsSelect" [executedSql]="cacheSql" [dbContext]="tabInfo?.dbInfo"
                [isExpanded]="queryResultExpanded" [isLoading]="isLoadingQuery" [isLoadingMore]="isLoadingMore"
                [errorMessage]="queryError" [executionTimeMs]="queryExecutionTimeMs"
                [canCancelQuery]="true" (cancelQuery)="cancelRunningQuery()"
                (rowLimitChange)="onQueryFetchSizeChange($event)" (refreshQuery)="refreshQueryWithFetchSize()"
                (resultHeightChange)="onQueryResultHeightChange($event)"
                (toggleExpanded)="toggleQueryResultExpanded()"
                (closeResult)="closeQueryResult()"></app-table-query>
        </div>
    </div>
</div>

<app-toast></app-toast>
<app-query-history *ngIf="isHistoryOpen && active" [tabInfo]="tabInfo" [currentSql]="historySql"
    (closed)="isHistoryOpen = false" (newFile)="newFileRequested.emit($event)"></app-query-history>
<app-query-dataflow-debugger *ngIf="isDataflowOpen && active" [sql]="dataflowSql" [dbContext]="tabInfo?.dbInfo"
    [queryName]="tabInfo?.name || ''" (closed)="isDataflowOpen = false"></app-query-dataflow-debugger>
<app-save-query [data]="dataSave" *ngIf="isSaveAsOpen" (saved)="savedSaveAs($event)" (close)="closeSaveAs()"></app-save-query>

<app-save-version-message *ngIf="isVersionMessageOpen" [queryName]="tabInfo?.name || ''"
    (confirmed)="confirmVersionMessage($event)" (closed)="closeVersionMessage()"></app-save-version-message>
